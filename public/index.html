<!DOCTYPE html>
<html>
    <head>
        <title>Join | KahootClone</title>
        <link rel = "stylesheet" href = "css/index.css">
        <link href="https://fonts.googleapis.com/css?family=Raleway" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1 id = "title">Join a Game</h1>
        <form action="/player/">
                <div class="form-field">
                    <label id = "label">Display Name</label>
                    <input id = "name" type = "text" name="name" autofocus/>
                </div>
                <br>
                <div class="form-field">
                    <label id = "label">Game Pin</label>
                    <input id = "pin" type="text" name="pin" placeholder="e.g. ABC123"/>
                </div>
                <br>
                <div class="form-field">
                    <button id = "joinButton">Join</button>
                </div>
        </form>
        <br/>
        <center>
            <a href="/create/" id="host">Click here to host a Kahoot!</a>
            <br/><br/>
            <a href="/practice" id="host">📖 Practice Mode - Study Solo</a>
        </center>

        <script>
            // Auto-fill room code from URL parameter
            document.addEventListener('DOMContentLoaded', () => {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');

                if (code) {
                    const pinInput = document.getElementById('pin');
                    if (pinInput) {
                        pinInput.value = code.toUpperCase();
                        // Auto-focus the name input so user can start typing immediately
                        const nameInput = document.getElementById('name');
                        if (nameInput) {
                            nameInput.focus();
                        }
                    }
                }
            });
        </script>
    </body>
</html>
