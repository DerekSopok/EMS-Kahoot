<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EMS Kahoot</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Admin Dashboard</h1>
            <nav class="admin-nav">
                <a href="/admin" class="active">Quizzes</a>
                <a href="/admin/analytics.html">Analytics</a>
            </nav>
            <div class="header-actions">
                <button class="btn btn-primary" id="createQuizBtn">+ Create New Quiz</button>
                <a href="/" class="btn btn-secondary">Back to Game</a>
            </div>
        </header>

        <section id="loginPrompt" class="login-prompt hidden">
            <h2>Admin Login</h2>
            <p>Enter your admin token to manage quizzes.</p>
            <form id="loginForm" class="login-form">
                <label for="adminTokenInput">Admin Token</label>
                <input type="password" id="adminTokenInput" autocomplete="current-password" required>
                <button type="submit" class="btn btn-primary">Unlock Dashboard</button>
            </form>
            <p id="loginMessage" class="login-message"></p>
        </section>

        <section id="dashboard" class="dashboard hidden">
            <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
            <div class="table-wrapper">
                <table class="quiz-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Questions</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quiz-list"></tbody>
                </table>
            </div>
            <div id="quiz-empty" class="empty-state hidden">
                <h3>No quizzes found</h3>
                <p>Create your first quiz to get started.</p>
                <button class="btn btn-primary" id="emptyCreateBtn">Create New Quiz</button>
            </div>
        </section>
    </div>

    <script src="/admin/admin.js"></script>
</body>
</html>
