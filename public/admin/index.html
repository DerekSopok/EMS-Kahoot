<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management - EMS Kahoot</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Quiz Management</h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="createQuizBtn">+ Create New Quiz</button>
                <a href="/" class="btn btn-secondary">Back to Game</a>
            </div>
        </header>

        <div class="filter-bar">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Trauma">Trauma</option>
                <option value="Cardiac">Cardiac</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Airway">Airway</option>
                <option value="Medical">Medical</option>
                <option value="Pediatric">Pediatric</option>
                <option value="OB">OB</option>
                <option value="Ops">Ops</option>
                <option value="Other">Other</option>
            </select>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search quizzes...">
            </div>
        </div>

        <div id="quizzesContainer" class="quizzes-grid">
            <div class="loading">Loading quizzes...</div>
        </div>
    </div>

    <!-- Create/Edit Quiz Modal -->
    <div id="quizModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Quiz</h2>
                <span class="close">&times;</span>
            </div>
            <form id="quizForm">
                <input type="hidden" id="quizId">

                <div class="form-group">
                    <label for="quizTitle">Title *</label>
                    <input type="text" id="quizTitle" required minlength="3" maxlength="200">
                </div>

                <div class="form-group">
                    <label for="quizDescription">Description</label>
                    <textarea id="quizDescription" rows="3" maxlength="500"></textarea>
                </div>

                <div class="form-group">
                    <label for="quizCategory">Category *</label>
                    <select id="quizCategory" required>
                        <option value="Trauma">Trauma</option>
                        <option value="Cardiac">Cardiac</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Airway">Airway</option>
                        <option value="Medical">Medical</option>
                        <option value="Pediatric">Pediatric</option>
                        <option value="OB">OB</option>
                        <option value="Ops">Ops</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="quizPublic" checked>
                        <span>Public (visible to all users)</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Quiz</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/admin.js"></script>
</body>
</html>
